<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Resumos • ATAMF</title><style>body{margin:0;background:#061a33;color:#f2f6ff;font:15px system-ui}.wrap{max-width:640px;margin:auto;padding:18px}a{color:#8bd3ff}h1{font-size:24px}.notice{color:#b7cbe1}.card{background:#0d2a4b;border:1px solid #2a5276;border-radius:16px;padding:15px;margin:13px 0}button,select,input{font:inherit;border-radius:10px;padding:10px}button{border:1px solid #51728e;background:#173f65;color:white}button.on{background:#ffd52e;color:#061a33;font-weight:bold}select,input{width:100%;box-sizing:border-box;background:#09203b;color:white;border:1px solid #50718c}.levels{display:flex;gap:6px;flex-wrap:wrap}.levels button{flex:1;font-size:13px}small{color:#a5bdd4}.note{border-left:3px solid #ffd52e;padding-left:10px}.done{margin-top:12px}</style></head><body><div class="wrap"><a href="./estudos.html#reading">← Voltar à Leitura</a><h1>ATAMF • Resumos</h1><p class="notice">Biblioteca inicial de revisão: 9 assuntos de abertura, um por disciplina. São sínteses preliminares vinculadas às aulas identificadas nos PDFs, não substituem a leitura nem constituem auditoria integral das 114 aulas.</p><input id="q" placeholder="Buscar disciplina ou assunto" oninput="render()"><p id="count"></p><div id="cards"></div></div><script>const T=[["Português","Ortografia","Aula 00 - Ortografia","A ortografia estabelece a grafia convencional das palavras, incluindo emprego de letras, acentuação e uso do hífen.","Distingua regras ortográficas de regras de pronúncia. Na resolução, identifique a regra envolvida e verifique exceções antes de decidir a grafia.","Revisar acentuação, hífen, grafias parecidas e exceções."],["Regime Jurídico dos Agentes Públicos","Improbidade administrativa","Aula 00 - Improbidade","A improbidade administrativa envolve condutas tipificadas em lei, exigindo atenção ao elemento subjetivo e às hipóteses legais.","Estude a Lei 8.429/1992 conforme as alterações posteriores, distinguindo modalidades de atos, requisitos e sanções. Confira a redação legal atualizada para prazos e consequências.","Diferenciar tipos de atos, dolo, sanções e prescrição."],["Gestão de Pessoas e Atendimento ao Público","Motivação","Aula 00 - Motivação","Motivação diz respeito aos fatores que influenciam o esforço e a persistência no trabalho.","Compare teorias de conteúdo e de processo e evite confundir satisfação, desempenho e motivação. Em questões, identifique qual teoria explica o comportamento apresentado.","Revisar Maslow, Herzberg, expectativas e equidade."],["Atualidades","Economia e sociedade internacional","Aula 00 - Economia e Sociedade Internacional","O tema relaciona economia mundial, comércio, instituições e transformações sociais.","Organize fatos por data, atores envolvidos, causas e consequências. Atualidades dependem do período de referência: notícias posteriores ao PDF exigem conferência independente.","Revisar contexto, cronologia e consequências; confirmar fatos recentes."],["Administração Pública","Orçamento público","Aula 00 - Orçamento","O orçamento público organiza a previsão de receitas e a autorização de despesas governamentais.","Diferencie PPA, LDO e LOA e associe cada instrumento à sua função. Observe princípios orçamentários, etapas do ciclo e regras constitucionais e legais.","Revisar PPA × LDO × LOA, princípios e ciclo orçamentário."],["Matemática e Raciocínio Lógico","Estruturas lógicas","Aula 00 - Estruturas Lógicas","Proposições são enunciados aos quais se pode atribuir valor lógico verdadeiro ou falso.","Identifique proposições simples e compostas, conectivos e condições de verdade. Treine negação, conjunção, disjunção, condicional e bicondicional com tabelas-verdade.","Revisar conectivos, negações e tabelas-verdade."],["Informática","Conceitos de redes","Aula 00 - Conceitos de Rede 1","Redes conectam dispositivos para comunicação e compartilhamento de recursos.","Diferencie LAN, WAN, Internet e intranet; compreenda endereçamento, protocolos e funções de equipamentos de rede. Observe diferenças entre roteadores e switches.","Revisar LAN/WAN, TCP/IP, DNS, roteador e switch."],["Controle Externo e Legislação Institucional","Controle da Administração","Aula 00 - Controle","O controle da Administração busca fiscalizar legalidade, legitimidade e outros aspectos previstos no ordenamento.","Diferencie controle interno, externo e social. Estude competências constitucionais e o papel dos tribunais de contas, sem confundir fiscalização com função jurisdicional.","Revisar controle interno × externo e competências dos tribunais de contas."],["Ética no Serviço Público","Código de Ética","Aula 01 - Decreto 1.171-1994","O Decreto 1.171/1994 aprova o Código de Ética Profissional do Servidor Público Civil do Poder Executivo Federal.","Estude deveres, vedações e regras de comportamento ético, distinguindo responsabilidade ética de outras esferas de responsabilização. Confira o âmbito de aplicação da norma.","Revisar deveres, vedações e âmbito de aplicação."]];let mode=localStorage.getItem('atamf-reading-mode')||'rapido';const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));function setMode(m){mode=m;localStorage.setItem('atamf-reading-mode',m);render()}function toggle(i){let k='atamf-reading-'+i;localStorage.setItem(k,localStorage.getItem(k)==='done'?'todo':'done');render()}function render(){let s=q.value.toLowerCase(),rows=T.map((t,i)=>({t,i})).filter(x=>(x.t[0]+' '+x.t[1]).toLowerCase().includes(s));count.textContent=rows.length+' assunto(s) exibido(s) • '+T.length+' resumos iniciais';cards.innerHTML=rows.map(({t,i})=>{let text=mode==='rapido'?t[3]:mode==='completo'?t[3]+' '+t[4]:t[5];return '<section class="card"><small>'+esc(t[0])+'</small><h2>'+esc(t[1])+'</h2><small>Referência: '+esc(t[2])+'</small><div class="levels"><button class="'+(mode==='rapido'?'on':'')+'" onclick="setMode(\'rapido\')">Rápido</button><button class="'+(mode==='completo'?'on':'')+'" onclick="setMode(\'completo\')">Completo</button><button class="'+(mode==='vespera'?'on':'')+'" onclick="setMode(\'vespera\')">Véspera</button></div><p class="note">'+esc(text)+'</p><button class="done" onclick="toggle('+i+')">'+(localStorage.getItem('atamf-reading-'+i)==='done'?'✓ Revisado — desfazer':'Marcar como revisado')+'</button></section>'}).join('')||'<p>Nenhum assunto encontrado.</p>'}render();</script></body></html>
