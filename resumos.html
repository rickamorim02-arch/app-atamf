<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071a33"><title>Leitura • ATAMF</title><style>*{box-sizing:border-box}html,body{margin:0;background:#061a33;color:#f2f6ff;font:16px system-ui,-apple-system,sans-serif}main{max-width:720px;margin:auto;padding:16px 18px 110px}h1{font-size:26px;margin:12px 0}h2{font-size:22px}p{line-height:1.65}.muted{color:#bbcbdd}.count,.subject,.article{border:1px solid #2a5276;background:#102e50;border-radius:19px;padding:20px;margin:16px 0}.count{font-size:19px}.subject{padding:0;overflow:hidden}.subject summary{padding:20px;font-size:20px;font-weight:750;cursor:pointer;list-style:none}.subject summary::-webkit-details-marker{display:none}.subject summary:before{content:'▶ ';font-size:15px}.subject[open] summary:before{content:'▼ '}.lessons{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:0 20px 20px}.lesson{border:1px solid #315779;border-radius:15px;background:#071b34;color:white;padding:17px 7px;font:inherit;font-size:19px;cursor:pointer}.lesson.on{background:#ffd52e;color:#061a33;font-weight:800}.article{background:#102e50;scroll-margin-top:14px}.article small{color:#bbcbdd}.article h2{font-size:28px}.article h3{font-size:22px;margin-top:28px}.article p{font-size:19px;line-height:1.85}.controls{display:flex;gap:8px;flex-wrap:wrap}.controls button,.done{border:1px solid #315779;border-radius:12px;background:#0a2341;color:white;padding:12px;font:inherit;cursor:pointer}.controls button.on,.done.on{background:#ffd52e;color:#061a33;font-weight:bold}.search{width:100%;background:#071b34;color:white;border:1px solid #315779;border-radius:13px;padding:13px;font:inherit}body.embedded main{padding-top:2px}@media(min-width:800px){main{max-width:920px}.lessons{grid-template-columns:repeat(4,minmax(0,1fr))}}</style></head><body><main><h1>📖 Leitura</h1><p class="muted">Resumos extraídos e organizados por matéria e aula. Selecione uma aula para ler diretamente nesta tela.</p><div class="count" id="count"></div><input id="search" class="search" placeholder="Buscar matéria, aula ou assunto" aria-label="Buscar resumos"><div id="subjects"></div><div id="article"></div></main><script>const T=[["Português","Ortografia","Aula 00 - Ortografia","A ortografia estabelece a grafia convencional das palavras, incluindo emprego de letras, acentuação e uso do hífen.","Distingua regras ortográficas de regras de pronúncia. Na resolução, identifique a regra envolvida e verifique exceções antes de decidir a grafia.","Revisar acentuação, hífen, grafias parecidas e exceções."],["Regime Jurídico dos Agentes Públicos","Improbidade administrativa","Aula 00 - Improbidade","A improbidade administrativa envolve condutas tipificadas em lei, exigindo atenção ao elemento subjetivo e às hipóteses legais.","Estude a Lei 8.429/1992 conforme as alterações posteriores, distinguindo modalidades de atos, requisitos e sanções. Confira a redação legal atualizada para prazos e consequências.","Diferenciar tipos de atos, dolo, sanções e prescrição."],["Gestão de Pessoas e Atendimento ao Público","Motivação","Aula 00 - Motivação","Motivação diz respeito aos fatores que influenciam o esforço e a persistência no trabalho.","Compare teorias de conteúdo e de processo e evite confundir satisfação, desempenho e motivação. Em questões, identifique qual teoria explica o comportamento apresentado.","Revisar Maslow, Herzberg, expectativas e equidade."],["Atualidades","Economia e sociedade internacional","Aula 00 - Economia e Sociedade Internacional","O tema relaciona economia mundial, comércio, instituições e transformações sociais.","Organize fatos por data, atores envolvidos, causas e consequências. Atualidades dependem do período de referência: notícias posteriores ao PDF exigem conferência independente.","Revisar contexto, cronologia e consequências; confirmar fatos recentes."],["Administração Pública","Orçamento público","Aula 00 - Orçamento","O orçamento público organiza a previsão de receitas e a autorização de despesas governamentais.","Diferencie PPA, LDO e LOA e associe cada instrumento à sua função. Observe princípios orçamentários, etapas do ciclo e regras constitucionais e legais.","Revisar PPA × LDO × LOA, princípios e ciclo orçamentário."],["Matemática e Raciocínio Lógico","Estruturas lógicas","Aula 00 - Estruturas Lógicas","Proposições são enunciados aos quais se pode atribuir valor lógico verdadeiro ou falso.","Identifique proposições simples e compostas, conectivos e condições de verdade. Treine negação, conjunção, disjunção, condicional e bicondicional com tabelas-verdade.","Revisar conectivos, negações e tabelas-verdade."],["Informática","Conceitos de redes","Aula 00 - Conceitos de Rede 1","Redes conectam dispositivos para comunicação e compartilhamento de recursos.","Diferencie LAN, WAN, Internet e intranet; compreenda endereçamento, protocolos e funções de equipamentos de rede. Observe diferenças entre roteadores e switches.","Revisar LAN/WAN, TCP/IP, DNS, roteador e switch."],["Controle Externo e Legislação Institucional","Controle da Administração","Aula 00 - Controle","O controle da Administração busca fiscalizar legalidade, legitimidade e outros aspectos previstos no ordenamento.","Diferencie controle interno, externo e social. Estude competências constitucionais e o papel dos tribunais de contas, sem confundir fiscalização com função jurisdicional.","Revisar controle interno × externo e competências dos tribunais de contas."],["Ética no Serviço Público","Código de Ética","Aula 01 - Decreto 1.171-1994","O Decreto 1.171/1994 aprova o Código de Ética Profissional do Servidor Público Civil do Poder Executivo Federal.","Estude deveres, vedações e regras de comportamento ético, distinguindo responsabilidade ética de outras esferas de responsabilização. Confira o âmbito de aplicação da norma.","Revisar deveres, vedações e âmbito de aplicação."],["Português","Classes de palavras (morfologia)","Aula 01 - Morfologia, p. 3","Morfologia estuda classes de palavras e suas propriedades; a classificação depende da função e do contexto.","As classes incluem substantivo, artigo, adjetivo, numeral, pronome, verbo, advérbio, preposição, conjunção e interjeição. Diferencie palavras variáveis e invariáveis e analise exemplos em frases.","Revisar as dez classes, flexões e mudança de classe pelo contexto."],["Regime Jurídico dos Agentes Públicos","Agentes públicos e normas constitucionais","Aula 01 - Normas Constitucionais relacionadas a Servidores, p. 3","O Estado atua por intermédio de pessoas físicas, os agentes públicos, que manifestam sua vontade nas atividades administrativas.","Diferencie cargo, emprego e função pública; servidores estatutários e empregados públicos. Examine acesso por concurso, acumulação e regras constitucionais, verificando exceções.","Revisar agentes, cargos, empregos, funções, concurso e acumulação."],["Gestão de Pessoas e Atendimento ao Público","Comunicação eficaz","Aula 01 - Comunicação Eficaz, p. 3","Comunicação é essencial à liderança, à motivação e à interação com servidores e cidadãos.","Identifique emissor, receptor, mensagem, canal, código, contexto e retorno. Barreiras podem distorcer a mensagem; comunicação eficaz exige clareza, escuta e feedback.","Revisar elementos da comunicação, ruídos, feedback e escuta ativa."],["Atualidades","Política e sociedade internacional: Oriente Médio","Aula 01 - Política e Sociedade Internacional 1, p. 3","A aula aborda o islamismo, o mundo árabe e o Oriente Médio, distinguindo referências religiosas, culturais e geográficas.","Islamismo é religião monoteísta; árabe é referência linguístico-cultural; Oriente Médio é região geopolítica. Esses conjuntos não são equivalentes. Avalie conflitos com atenção a atores, cronologia e fontes.","Revisar diferenças entre islamismo, mundo árabe e Oriente Médio."],["Administração Pública","Princípios orçamentários","Aula 01 - Princípios, p. 3","Princípios orçamentários orientam a elaboração, a execução e o controle do orçamento público.","Compare unidade, universalidade, anualidade, exclusividade, orçamento bruto, publicidade e não afetação, observando as exceções expressamente previstas no ordenamento.","Revisar definição de cada princípio e exceções."],["Matemática e Raciocínio Lógico","Equivalências lógicas","Aula 01 - Esquivalências Lógicas, p. 3","Duas proposições são logicamente equivalentes quando possuem os mesmos valores lógicos em todas as possibilidades.","A condicional p→q equivale a ¬p∨q e à contrapositiva ¬q→¬p. Pela lei de De Morgan, ¬(p∧q) equivale a ¬p∨¬q; ¬(p∨q) equivale a ¬p∧¬q.","Memorizar condicional, contrapositiva e leis de De Morgan."],["Informática","Protocolos de comunicação","Aula 01 - Conceitos de Rede 2, p. 3","Protocolos definem regras de comunicação entre dispositivos; a aula introduz IP, TCP, UDP e HTTP.","IP participa do endereçamento e encaminhamento de pacotes; TCP oferece transporte confiável orientado à conexão; UDP não estabelece conexão e tem menor sobrecarga; HTTP é protocolo de aplicação para comunicação web.","Revisar funções de IP, TCP, UDP, HTTP e HTTPS."],["Controle Externo e Legislação Institucional","Tribunais de contas e sistemas de controle","Aula 01 - Tribunal de Contas, p. 3","O sistema brasileiro de controle externo adota tribunais de contas; o TCU atua como instituição superior de fiscalização no âmbito federal.","Diferencie sistema de controle interno e externo. O controle externo federal é exercido pelo Congresso Nacional com auxílio do TCU, conforme a Constituição, sem equivaler a subordinação hierárquica.","Revisar Congresso Nacional, TCU, controle externo e interno."],["Ética no Serviço Público","Ética e moral","Aula 02 - Ética e Moral, p. 3","Ética investiga criticamente valores e critérios de conduta; moral refere-se a normas, costumes e valores praticados em grupos sociais.","A distinção é conceitual e pode variar conforme a abordagem filosófica. Em questões, examine se o enunciado trata de reflexão crítica ou de regras e costumes compartilhados.","Revisar ética × moral, valores, normas e conduta profissional."]];let chosen=-1,mode='completo';const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const key=i=>'atamf-reading-'+i;function show(i){chosen=i;render();const a=document.getElementById('article');if(a)a.scrollIntoView({behavior:'smooth',block:'start'})}function setMode(m){mode=m;renderArticle()}function toggle(){if(chosen<0)return;localStorage.setItem(key(chosen),localStorage.getItem(key(chosen))==='done'?'todo':'done');renderArticle()}function renderArticle(){const el=document.getElementById('article');if(chosen<0){el.innerHTML='';return}const t=T[chosen];if(!t){el.innerHTML='';return}el.innerHTML='<article class="article"><small>'+esc(t[0])+' • '+esc(t[2])+'</small><h2>'+esc(t[2])+'</h2><p><strong>'+esc(t[1])+'</strong></p><div class="controls"><button class="'+(mode==='rapido'?'on':'')+'" onclick="setMode(\'rapido\')">Rápido</button><button class="'+(mode==='completo'?'on':'')+'" onclick="setMode(\'completo\')">Completo</button><button class="'+(mode==='vespera'?'on':'')+'" onclick="setMode(\'vespera\')">Véspera</button></div><h3>1. Conceito e fundamentos</h3><p>'+esc(t[3])+'</p>'+(mode==='rapido'?'':mode==='completo'?'<h3>2. Pontos importantes</h3><p>'+esc(t[4])+'</p>':'<h3>Revisão de véspera</h3><p>'+esc(t[5])+'</p>')+'<button class="done '+(localStorage.getItem(key(chosen))==='done'?'on':'')+'" onclick="toggle()">'+(localStorage.getItem(key(chosen))==='done'?'✓ Revisado — desfazer':'Marcar como revisado')+'</button></article>'}function render(){const query=document.getElementById('search').value.trim().toLowerCase();const subjects=[...new Set(T.map(t=>t[0]))];const groups=subjects.map(subject=>({subject,items:T.map((t,i)=>({t,i})).filter(x=>x.t[0]===subject&&(subject+' '+x.t[1]+' '+x.t[2]).toLowerCase().includes(query))})).filter(g=>g.items.length);document.getElementById('count').textContent=T.length+' resumos carregados';document.getElementById('subjects').innerHTML=groups.map(g=>'<details class="subject" '+(g.items.some(x=>x.i===chosen)||query?'open':'')+'><summary>'+esc(g.subject)+' <span class="muted">('+g.items.length+' aulas)</span></summary><div class="lessons">'+g.items.map(x=>'<button class="lesson '+(chosen===x.i?'on':'')+'" onclick="show('+x.i+')">'+esc((x.t[2].match(/Aula\s*\d+/i)||[x.t[1]])[0])+'</button>').join('')+'</div></details>').join('')||'<p class="muted">Nenhum resumo encontrado.</p>';renderArticle()}document.getElementById('search').addEventListener('input',render);if(self!==top)document.body.classList.add('embedded');render();</script></body></html>
