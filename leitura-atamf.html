<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leitura ATAMF</title><style>*{box-sizing:border-box}body{margin:0;background:#061a33;color:#f4f7ff;font:16px system-ui}main{max-width:900px;margin:auto;padding:20px 18px 110px}h1{font-size:25px}.muted{color:#b6c8dd}.count,details,article{background:#102d4d;border:1px solid #315779;border-radius:18px;margin:16px 0;padding:18px}summary{font-size:20px;font-weight:750;cursor:pointer}.lessons{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}button{background:#071b34;color:white;border:1px solid #315779;border-radius:13px;padding:15px;font:inherit}button.on{background:#ffd52e;color:#07182e;font-weight:bold}article{scroll-margin-top:15px;font-size:18px;line-height:1.8}article h2{font-size:28px}article h3{font-size:22px;margin-top:25px}article p{line-height:1.8}input{width:100%;padding:14px;background:#071b34;color:white;border:1px solid #315779;border-radius:12px;font:inherit}@media(min-width:750px){.lessons{grid-template-columns:repeat(4,1fr)}}</style></head><body><main><h1>📖 Leitura • ATAMF</h1><p class="muted">Resumos organizados por matéria e aula.</p><div id="count" class="count">Carregando biblioteca...</div><input id="search" placeholder="Buscar matéria ou aula"><div id="groups"></div><div id="reader"></div></main><script>let data=[],selected=-1;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));function openLesson(i){selected=i;const x=data[i];if(!x)return;const reader=document.getElementById('reader');reader.innerHTML='<article><small>'+esc(x.subject)+' • '+esc(x.lesson)+'</small><h2>'+esc(x.lesson)+'</h2>'+x.content+'</article>';window.ATAMF_CURRENT_LESSON=x.subject+'||'+x.lesson;window.ATAMF_CURRENT_INDEX=i;window.dispatchEvent(new Event('atamf:lesson-open'));reader.scrollIntoView({behavior:'auto',block:'start'});document.querySelectorAll('.lesson.on').forEach(b=>b.classList.remove('on'));const btn=document.querySelector('.lesson[data-index="'+i+'"]');if(btn)btn.classList.add('on')}function render(){const q=document.getElementById('search').value.toLowerCase(),subjects=[...new Set(data.map(x=>x.subject))];document.getElementById('count').textContent=data.length+' resumos carregados';document.getElementById('groups').innerHTML=subjects.map(subject=>{const rows=data.map((x,i)=>({x,i})).filter(v=>v.x.subject===subject&&(v.x.subject+' '+v.x.lesson).toLowerCase().includes(q));return rows.length?'<details '+(q?'open':'')+'><summary>'+esc(subject)+' ('+rows.length+' aulas)</summary><div class="lessons">'+rows.map(v=>'<button data-index="'+v.i+'" class="lesson '+(selected===v.i?'on':'')+'" onclick="openLesson('+v.i+')">'+esc(v.x.lesson)+'</button>').join('')+'</div></details>':''}).join('')}document.getElementById('search').oninput=render;fetch('./dados-leitura-atamf.json').then(r=>{if(!r.ok)throw Error('Dados não publicados');return r.json()}).then(d=>{data=d;render()}).catch(()=>{document.getElementById('count').textContent='Biblioteca ainda não enviada. Acesse os resumos iniciais.';document.getElementById('groups').innerHTML='<a href="./resumos.html" style="color:#ffd52e">Abrir resumos disponíveis</a>'});</script><script src="./atamf-reading-tools.js?v=1" defer></script></body></html>
