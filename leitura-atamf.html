<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leitura ATAMF</title><style>*{box-sizing:border-box}body{margin:0;background:#061a33;color:#f4f7ff;font:16px system-ui}main{max-width:900px;margin:auto;padding:20px 18px 110px}h1{font-size:25px}.muted{color:#b6c8dd}.count,details,article{background:#102d4d;border:1px solid #315779;border-radius:18px;margin:16px 0;padding:18px}summary{font-size:20px;font-weight:750;cursor:pointer}.lessons{display:grid;grid-template-columns:1fr;gap:8px;margin-top:18px}.lessonRow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:stretch}.lessonRow .lesson{width:100%;text-align:left}.lessonRow .done{min-width:94px;padding:10px 12px;border-color:#52718e;color:#c8d6e5;font-size:14px}.lessonRow .done.isDone{background:#145b43;border-color:#43d69b;color:#fff;font-weight:800}.lessonRow .lesson.isDoneLesson{border-color:#43d69b}button{background:#071b34;color:white;border:1px solid #315779;border-radius:13px;padding:15px;font:inherit}button.on{background:#ffd52e;color:#07182e;font-weight:bold}article{scroll-margin-top:15px;font-size:18px;line-height:1.8}article h2{font-size:28px}article h3{font-size:22px;margin-top:25px}article p{line-height:1.8}input{width:100%;padding:14px;background:#071b34;color:white;border:1px solid #315779;border-radius:12px;font:inherit}@media(min-width:750px){.lessons{grid-template-columns:repeat(4,1fr)}}</style></head><body><main><h1>📖 Leitura • ATAMF</h1><p class="muted">Resumos organizados por matéria e aula.</p><div id="count" class="count">Carregando biblioteca...</div><input id="search" placeholder="Buscar matéria ou aula"><div id="groups"></div><div id="reader"></div></main><script>let data=[],selected=-1;const DONE_PREFIX='atamf-read-done-v1:';const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));function lessonKey(x){return DONE_PREFIX+x.subject+'||'+x.lesson}function isDone(x){return localStorage.getItem(lessonKey(x))==='1'}function toggleDone(i){const x=data[i];if(!x)return;const key=lessonKey(x);if(isDone(x))localStorage.removeItem(key);else localStorage.setItem(key,'1');render()}const AUDIO_DB='atamf-lesson-audio-v1',AUDIO_STORE='files';
function audioDb(){return new Promise((resolve,reject)=>{const req=indexedDB.open(AUDIO_DB,1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains(AUDIO_STORE))req.result.createObjectStore(AUDIO_STORE)};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function getLessonAudio(key){const db=await audioDb();return new Promise((resolve,reject)=>{const tx=db.transaction(AUDIO_STORE,'readonly'),req=tx.objectStore(AUDIO_STORE).get(key);req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error)})}
async function putLessonAudio(key,file){const db=await audioDb();return new Promise((resolve,reject)=>{const tx=db.transaction(AUDIO_STORE,'readwrite');tx.objectStore(AUDIO_STORE).put({blob:file,name:file.name,type:file.type||'audio/mpeg',updated:Date.now()},key);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error)})}
async function deleteLessonAudio(key){const db=await audioDb();return new Promise((resolve,reject)=>{const tx=db.transaction(AUDIO_STORE,'readwrite');tx.objectStore(AUDIO_STORE).delete(key);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error)})}
async function refreshLessonAudio(){const x=data[selected];if(!x)return;const panel=document.getElementById('lessonAudio');if(!panel)return;try{const saved=await getLessonAudio(x.subject+'||'+x.lesson);if(selected<0||!document.getElementById('lessonAudio'))return;if(saved){const url=URL.createObjectURL(saved.blob);panel.innerHTML='<p><b>🎧 Áudio desta aula</b></p><audio controls preload="metadata" style="width:100%" src="'+url+'"></audio><p class="muted">'+esc(saved.name||'Áudio salvo')+'</p><button type="button" id="removeLessonAudio">Remover áudio</button>';document.getElementById('removeLessonAudio').onclick=async()=>{await deleteLessonAudio(x.subject+'||'+x.lesson);refreshLessonAudio()}}else{panel.innerHTML='<b>🎧 Áudio desta aula</b><p class="muted">Adicione um arquivo de áudio para ouvir junto com esta aula. Ele ficará salvo neste dispositivo.</p><label for="lessonAudioFile" style="display:block;padding:12px;border:1px solid #52718e;border-radius:12px;text-align:center;cursor:pointer">＋ Adicionar áudio (MP3, M4A, WAV...)</label><input id="lessonAudioFile" type="file" accept="audio/*" style="display:none">';document.getElementById('lessonAudioFile').onchange=async e=>{const f=e.target.files&&e.target.files[0];if(!f)return;try{await putLessonAudio(x.subject+'||'+x.lesson,f);refreshLessonAudio()}catch(err){alert('Não foi possível salvar o áudio. Verifique o espaço disponível no dispositivo.')}}}}catch(err){panel.innerHTML='<p class="muted">Não foi possível abrir o armazenamento de áudio neste navegador.</p>'}}
function openLesson(i){selected=i;const x=data[i];if(!x)return;const reader=document.getElementById('reader');reader.innerHTML='<article><small>'+esc(x.subject)+' • '+esc(x.lesson)+'</small><h2>'+esc(x.lesson)+'</h2><section id="lessonAudio" style="background:#071b34;border:1px solid #315779;border-radius:14px;padding:14px;margin:16px 0"></section>'+x.content+'</article>';refreshLessonAudio();window.ATAMF_CURRENT_LESSON=x.subject+'||'+x.lesson;window.ATAMF_CURRENT_INDEX=i;window.dispatchEvent(new Event('atamf:lesson-open'));reader.scrollIntoView({behavior:'auto',block:'start'});document.querySelectorAll('.lesson.on').forEach(b=>b.classList.remove('on'));const btn=document.querySelector('.lesson[data-index="'+i+'"]');if(btn)btn.classList.add('on')}function render(){const groupsEl=document.getElementById('groups'),openSubjects=[...groupsEl.querySelectorAll('details')].filter(d=>d.open).map(d=>d.dataset.subject),q=document.getElementById('search').value.toLowerCase(),subjects=[...new Set(data.map(x=>x.subject))],done=data.filter(isDone).length;document.getElementById('count').textContent=data.length+' aulas • '+done+' lidas • '+(data.length-done)+' pendentes';groupsEl.innerHTML=subjects.map(subject=>{const all=data.filter(x=>x.subject===subject),read=all.filter(isDone).length,rows=data.map((x,i)=>({x,i})).filter(v=>v.x.subject===subject&&(v.x.subject+' '+v.x.lesson).toLowerCase().includes(q));return rows.length?'<details data-subject="'+esc(subject)+'" '+(q?'open':'')+'><summary>'+esc(subject)+' ('+read+'/'+all.length+' lidas)</summary><div class="lessons">'+rows.map(v=>'<div class="lessonRow"><button data-index="'+v.i+'" class="lesson '+(selected===v.i?'on ':'')+(isDone(v.x)?'isDoneLesson':'')+'" onclick="openLesson('+v.i+')">'+esc(v.x.lesson)+'</button><button class="done '+(isDone(v.x)?'isDone':'')+'" aria-label="'+(isDone(v.x)?'Marcar como não lida':'Marcar como lida')+'" onclick="toggleDone('+v.i+')">'+(isDone(v.x)?'✓ Lida':'○ Marcar OK')+'</button></div>').join('')+'</div></details>':''}).join('');if(!q)groupsEl.querySelectorAll('details').forEach(d=>{d.open=openSubjects.includes(d.dataset.subject)})}document.getElementById('search').oninput=render;fetch('./dados-leitura-atamf.json').then(r=>{if(!r.ok)throw Error('Dados não publicados');return r.json()}).then(d=>{data=d;render()}).catch(()=>{document.getElementById('count').textContent='Biblioteca ainda não enviada. Acesse os resumos iniciais.';document.getElementById('groups').innerHTML='<a href="./resumos.html" style="color:#ffd52e">Abrir resumos disponíveis</a>'});</script><script src="./atamf-reading-tools.js?v=5" defer></script></body></html>
